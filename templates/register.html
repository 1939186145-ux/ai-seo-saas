<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>注册</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
}

.box{
width:400px;
margin:100px auto;
background:white;
padding:30px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
width:100%;
padding:10px;
margin-top:20px;
background:#28a745;
color:white;
border:none;
}
</style>
</head>

<body>

<div class="box">

<h2>注册账号</h2>

<form method="POST">

<input name="username" placeholder="用户名">

<input
type="password"
name="password"
placeholder="密码"
>

<button type="submit">
注册
</button>

</form>

</div>

</body>
</html>
